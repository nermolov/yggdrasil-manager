[package]
name = "subduction-stdio-sync"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "subduction-stdio-sync"
path = "src/main.rs"

[dependencies]
# Subduction core crates — pinned SHA
automerge = { git = "https://github.com/inkandswitch/subduction.git", rev = "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2", package = "automerge" }

[profile.release]
opt-level = "s"
lto = true
strip = true

[profile.release.build-override]
opt-level = 0
